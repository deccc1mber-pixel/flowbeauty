<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serevko Beauty Salon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent: #f2a3b3;
            --bg: #000000;
            --card-bg: #1c1c1e;
            --text-gray: #8e8e93;
            --border: #2c2c2e;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none; /* Исправленная ошибка совместимости */
            overflow-x: hidden;
        }

        .container { padding: 20px; padding-bottom: 120px; }

        .header { margin-bottom: 25px; }
        .header h1 { font-size: 26px; font-weight: 700; margin: 0; }
        .header p { color: var(--text-gray); font-size: 14px; margin-top: 5px; }

        .section-title { font-size: 18px; font-weight: 600; margin: 25px 0 15px; color: #fff; }

        /* Карточки мастеров */
        .master-card {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .master-card.selected { border-color: var(--accent); background: #251d1f; }
        .master-avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; margin-right: 15px; overflow: hidden; }
        .master-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .master-info h4 { margin: 0; font-size: 16px; }
        .master-info p { margin: 0; font-size: 13px; color: var(--text-gray); }

        /* Сетка времени */
        .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .time-slot {
            background: var(--card-bg);
            padding: 12px 5px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .time-slot.selected { background: var(--accent); color: black; border-color: var(--accent); }

        /* Фиксированная кнопка внизу */
        .footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 20px; background: linear-gradient(to top, black, transparent);
            box-sizing: border-box;
        }
        .main-btn {
            background: var(--accent);
            color: black;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 800;
            opacity: 0.4;
            pointer-events: none;
            transition: 0.3s;
        }
        .main-btn.active { opacity: 1; pointer-events: auto; transform: scale(1); }
        .main-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Окрашивание волос</h1>
        <p>3 500 ₽ • 120 мин</p>
    </div>

    <div class="section-title">Выберите мастера</div>
    <div class="master-card" onclick="selectMaster(this, 'Анастасия')">
        <div class="master-avatar"><img src="https://i.pravatar.cc/100?u=1"></div>
        <div class="master-info"><h4>Анастасия</h4><p>Топ-мастер • ★ 4.9</p></div>
    </div>
    <div class="master-card" onclick="selectMaster(this, 'Екатерина')">
        <div class="master-avatar"><img src="https://i.pravatar.cc/100?u=3"></div>
        <div class="master-info"><h4>Екатерина</h4><p>Стилист • ★ 4.8</p></div>
    </div>

    <div class="section-title">Доступное время</div>
    <div class="time-grid">
        <div class="time-slot" onclick="selectTime(this, '10:00')">10:00</div>
        <div class="time-slot" onclick="selectTime(this, '12:00')">12:00</div>
        <div class="time-slot" onclick="selectTime(this, '14:00')">14:00</div>
        <div class="time-slot" onclick="selectTime(this, '16:00')">16:00</div>
        <div class="time-slot" onclick="selectTime(this, '18:00')">18:00</div>
        <div class="time-slot" onclick="selectTime(this, '20:00')">20:00</div>
    </div>
</div>

<div class="footer">
    <button id="confirm-btn" class="main-btn" onclick="sendData()">Подтвердить запись</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let booking = {
        service: "Окрашивание волос",
        master: null,
        time: null
    };

    function selectMaster(el, name) {
        document.querySelectorAll('.master-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        booking.master = name;
        validate();
        tg.HapticFeedback.impactOccurred('medium');
    }

    function selectTime(el, time) {
        document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        booking.time = time;
        validate();
        tg.HapticFeedback.impactOccurred('light');
    }

    function validate() {
        const btn = document.getElementById('confirm-btn');
        if (booking.master && booking.time) {
            btn.classList.add('active');
        }
    }

    function sendData() {
        tg.HapticFeedback.notificationOccurred('success');
        tg.sendData(JSON.stringify(booking));
    }
</script>

</body>
</html>
