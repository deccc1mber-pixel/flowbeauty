<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flow Beauty</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #707579;
            --tg-theme-secondary-bg-color: #f4f4f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 0;
            -webkit-user-select: none; /* Для Safari и Chrome */
user-select: none;         /* Стандартное свойство, которое просил VS Code */
        }

        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        .container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Блок текущей записи - скрыт по умолчанию */
        #my-booking-status {
            display: none;
            background-color: #e8f4fd;
            border: 2px solid var(--tg-theme-button-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .service-card {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .service-info h3 { margin: 0 0 5px 0; font-size: 17px; }
        .service-info p { margin: 0; font-size: 13px; color: var(--tg-theme-hint-color); }
        .price { font-weight: bold; color: var(--tg-theme-button-color); margin-top: 5px; }

        .btn-select {
            background-color: var(--tg-theme-button-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Форма записи */
        #booking-form {
            display: none;
            background: var(--tg-theme-bg-color);
            padding: 10px 0;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-back {
            width: 100%;
            padding: 10px;
            background: none;
            border: none;
            color: var(--tg-theme-hint-color);
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Flow Beauty</h1>
    <p>Запись на услуги</p>
</div>

<div class="container">
    <!-- Секция с подтвержденной записью -->
    <div id="my-booking-status">
        <h3 style="margin-top:0; color: #000;">✅ Вы записаны!</h3>
        <div id="confirmed-details" style="font-size: 15px; line-height: 1.5; color: #000;"></div>
    </div>

    <!-- Список услуг -->
    <div id="services-page">
        <h2 style="font-size: 20px;">Выберите услугу:</h2>
        <div id="services-list">Загрузка...</div>
    </div>

    <!-- Экран оформления -->
    <div id="booking-form">
        <h2 id="selected-service-title">Оформление</h2>
        
        <div class="form-group">
            <label>Мастер:</label>
            <select id="master-name">
                <option value="Артём (Топ-мастер)">Артём (Топ-мастер)</option>
                <option value="Мария (Стилист)">Мария (Стилист)</option>
                <option value="Дмитрий (Барбер)">Дмитрий (Барбер)</option>
                <option value="Елена (Визажист)">Елена (Визажист)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Удобное время:</label>
            <select id="booking-time">
                <option value="09:00">09:00</option>
                <option value="10:30">10:30</option>
                <option value="12:00">12:00</option>
                <option value="13:30">13:30</option>
                <option value="15:00">15:00</option>
                <option value="16:30">16:30</option>
                <option value="18:00">18:00</option>
                <option value="19:30">19:30</option>
                <option value="21:00">21:00</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ваш телефон для связи:</label>
            <input type="tel" id="customer-phone" placeholder="+7 (___) ___-__-__">
        </div>

        <button class="btn-main" onclick="submitBooking()">Подтвердить запись</button>
        <button class="btn-back" onclick="showServices()">← Назад к услугам</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const API_URL = 'https://silly-turkeys-share.loca.lt/api'; // ТВОЯ ССЫЛКА
    let currentService = null;

    tg.expand();

    // Загрузка услуг
    async function loadServices() {
        try {
            const response = await fetch(`${API_URL}/services`);
            const services = await response.json();
            const list = document.getElementById('services-list');
            list.innerHTML = '';

            services.forEach(s => {
                const card = document.createElement('div');
                card.className = 'service-card';
                card.innerHTML = `
                    <div class="service-info">
                        <h3>${s.name}</h3>
                        <p>${s.description}</p>
                        <div class="price">${s.price} ₽</div>
                    </div>
                    <button class="btn-select" onclick="openBooking('${s.id}', '${s.name}')">Выбрать</button>
                `;
                list.appendChild(card);
            });
        } catch (e) {
            document.getElementById('services-list').innerHTML = "Ошибка сервера. Проверь туннель!";
        }
    }

    function openBooking(id, name) {
        currentService = { id, name };
        document.getElementById('services-page').style.display = 'none';
        document.getElementById('booking-form').style.display = 'block';
        document.getElementById('selected-service-title').innerText = name;
    }

    function showServices() {
        document.getElementById('services-page').style.display = 'block';
        document.getElementById('booking-form').style.display = 'none';
    }

    async function submitBooking() {
        const phone = document.getElementById('customer-phone').value;
        const master = document.getElementById('master-name').value;
        const time = document.getElementById('booking-time').value;
        const user = tg.initDataUnsafe?.user;

        if (!phone || phone.length < 5) {
            tg.showAlert("Пожалуйста, введите корректный номер телефона");
            return;
        }

        const payload = {
            service_id: parseInt(currentService.id),
            customer_name: user ? `${user.first_name} ${user.last_name || ''}` : "Клиент",
            customer_phone: phone,
            booking_time: time,
            master_name: master
        };

        try {
            const response = await fetch(`${API_URL}/bookings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                // Прячем форму, показываем блок подтверждения
                document.getElementById('booking-form').style.display = 'none';
                document.getElementById('services-page').style.display = 'block';
                
                const statusBlock = document.getElementById('my-booking-status');
                statusBlock.style.display = 'block';
                document.getElementById('confirmed-details').innerHTML = `
                    <b>Услуга:</b> ${currentService.name}<br>
                    <b>Мастер:</b> ${master}<br>
                    <b>Время:</b> Сегодня в ${time}<br>
                    <b>Контакт:</b> ${phone}
                `;
                
                tg.showAlert("Запись успешно создана!");
            } else {
                tg.showAlert("Ошибка при записи. Попробуйте еще раз.");
            }
        } catch (e) {
            tg.showAlert("Нет связи с сервером.");
        }
    }

    loadServices();
</script>
</body>
</html>
